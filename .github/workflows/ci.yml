# Tests on every PHP version the plugin claims to support, and Plugin Check
# on exactly what ships: the tree git archive produces, so files marked
# export-ignore in .gitattributes are left out as they are from the zip.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a PSPG release that breaks the contract test is caught even
  # when nothing here changes.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 7.4 is the "Requires PHP" in readme.txt and the plugin header.
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint
        run: find . -name '*.php' -not -path './dist/*' -print0 | xargs -0 -n1 php -l > /dev/null

      # tests/pspg-contract-test.php checks this plugin's calls into PSPG
      # against the latest PSPG release on WordPress.org.
      - name: Download the latest PSPG
        run: |
          curl -sSfL -o "$RUNNER_TEMP/pspg.zip" https://downloads.wordpress.org/plugin/planetstudio-payment-gateway.zip
          unzip -q "$RUNNER_TEMP/pspg.zip" -d "$RUNNER_TEMP/pspg"

      - name: Tests
        env:
          PSPGD_PSPG_SOURCE: ${{ runner.temp }}/pspg/planetstudio-payment-gateway
        run: php tests/run.php

  # The plugin's SQL on a real database: tests/integration/db-test.php.
  # The oldest supported WordPress on the oldest supported PHP, and the
  # newest of both.
  database:
    name: Database (WordPress ${{ matrix.wp }}, PHP ${{ matrix.php }}, MySQL 8.0)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: '6.5'
            php: '7.4'
          - wp: 'latest'
            php: '8.4'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          tools: wp-cli
          coverage: none

      - name: Install WordPress and run the database tests
        env:
          DB_HOST: 127.0.0.1:3306
          DB_NAME: wordpress
          DB_USER: root
          DB_PASS: root
          WP_VERSION: ${{ matrix.wp }}
        run: sh tests/integration/run.sh "$RUNNER_TEMP/wordpress"

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the shipped tree
        run: |
          mkdir -p build
          git archive --format=tar --prefix=donations-for-planetstudio-payment-gateway/ HEAD | tar -x -C build

      # Errors fail the job; warnings are shown as annotations. 1.0.0 has
      # 56 warnings, mostly nonce checks on read-only GET parameters and the
      # plugin's own direct queries on its tables.
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/donations-for-planetstudio-payment-gateway
          ignore-warnings: true
